<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080c0e">
  <title>Register Owner · Runstead</title>
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
  <script>
    const initialTheme = localStorage.getItem("runstead-theme") || "dark";
    document.documentElement.dataset.theme = initialTheme;
    document.querySelector('meta[name="theme-color"]').content = initialTheme === "light" ? "#eeeae0" : "#080c0e";
  </script>
</head>
<body>
  <main class="auth-shell">
    <section class="card auth-card">
      <div class="brand auth-brand">
        <span class="brand-mark" aria-hidden="true">↗</span>
        Runstead
      </div>
      <p class="eyebrow">First-Time Setup</p>
      <h1>Create the owner account.</h1>
      <p class="muted">Registration closes permanently after this account is created.</p>
      {% if error %}
      <div class="notice danger" role="alert">{{ error }}</div>
      {% endif %}
      <form action="/register" method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div>
          <label for="username">Username</label>
          <input id="username" name="username" type="text" minlength="3" maxlength="64" autocomplete="username" required>
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" minlength="5" autocomplete="new-password" required>
        </div>
        <div>
          <label for="confirm_password">Confirm Password</label>
          <input id="confirm_password" name="confirm_password" type="password" minlength="5" autocomplete="new-password" required>
        </div>
        <button class="primary" type="submit">Create Owner Account</button>
      </form>
    </section>
  </main>
</body>
</html>
