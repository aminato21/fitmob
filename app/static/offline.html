<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080c0e">
  <title>Runstead · Offline</title>
  <link rel="stylesheet" href="/static/app.css">
  <script>
    const initialTheme = localStorage.getItem("runstead-theme") || "dark";
    document.documentElement.dataset.theme = initialTheme;
    document.querySelector('meta[name="theme-color"]').content = initialTheme === "light" ? "#eeeae0" : "#080c0e";
  </script>
</head>
<body>
  <main class="shell">
    <section class="card stack" style="margin-top:20vh">
      <p class="eyebrow">Offline</p>
      <h1>Runstead is waiting for your computer.</h1>
      <p class="muted">Reconnect to the same Wi-Fi and start the local Runstead server, then try again.</p>
      <a class="button" href="/dashboard">Try dashboard again</a>
    </section>
  </main>
</body>
</html>
