[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strava-beginner-analysis"
version = "0.1.0"
description = "FastAPI app for syncing and exporting beginner-friendly Strava running data"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "fitdecode>=0.11,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
strava-sync = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
  "templates/*.html",
  "static/*.css",
  "static/*.js",
  "static/*.json",
  "static/*.html",
  "static/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
